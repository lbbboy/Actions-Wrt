name: SSH Control Workflow

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Enable SSH connection?'
        required: true
        default: 'false'
        type: choice
        options:
          - false
          - true
      ngrok:
        description: 'Start SSH via ngrok'
        required: true
        default: 'false'
        type: choice
        options:
          - false
          - true

env:
  TZ: Asia/Shanghai

jobs:
  ssh-job:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'

      - name: Checkout
        uses: actions/checkout@main

      - name: SSH connection to Actions
        env:
          TELEGRAM_BOT_TOKEN : ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        uses: lbbboy/ssh2actions@main
        if: ${{ github.event.inputs.ssh == 'true' }}

      - name: Start SSH via ngrok
        uses: lbbboy/ssh2actions@main
        with:
          mode: ngrok
        env:
         NGROK_REGION: us
         SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
         TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
         TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
         if: ${{ github.event.inputs.ngrok == 'true' }}

      - name: Telegram notification
        if: env.TELEGRAM_TOKEN && ! contains(github.event.action, 'notg')
        continue-on-error: true
        run: |
         curl -k --data chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
         --data "text=🎉 OpenWrt ${{ env.VERSION }} ${{matrix.target}} 编译成功 😋  发布地址：https://github.com/${{ github.repository }}/releases ${{ env.COWURL }} ${{ env.WETRANS }} 🚀" \
         "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage"
